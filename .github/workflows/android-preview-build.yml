name: Android preview build

on:
  pull_request:
    branches:
      - staging
      - main
    paths:
      - "mobile/android/**"
      - "panthorium-logo*.png"
      - ".github/workflows/android-preview-build.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Install Capacitor
        working-directory: mobile/android
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Android project and sync
        working-directory: mobile/android
        run: |
          npx --no-install cap add android
          npx --no-install cap sync android
          npm run android:prepare
      - name: Build debug APK
        working-directory: mobile/android/android
        run: ./gradlew assembleDebug
      - name: Upload APK for device testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panthorium-android-preview
          path: mobile/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
