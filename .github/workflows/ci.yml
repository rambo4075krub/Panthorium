name: Panthorium CI

on:
  push:
    branches:
      - main
      - staging
      - phase5-agent-platform
  pull_request:
    branches:
      - main
      - staging
      - codex/browser-cloud-foundation-20261015

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: panthorium_ci_only
          POSTGRES_DB: panthorium_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d panthorium_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Syntax checks
        run: npm run check
      - name: Install media test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Run tests
        run: npm test
      - name: Social media real browser audio and video
        run: |
          npx playwright install --with-deps --only-shell chromium
          node test/social-rtc-browser.js
      - name: Real PostgreSQL foundation and organization integration
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:panthorium_ci_only@127.0.0.1:5432/panthorium_ci
      - name: Speaker service contract tests
        run: |
          python3 -m pip install --user numpy==1.26.4
          python3 -m unittest discover -s speaker-service -p 'test_*.py'
