name: Panthorium CI

on:
  push:
    branches:
      - main
      - staging
      - phase5-agent-platform
  pull_request:
    branches:
      - main
      - staging
      - codex/browser-cloud-foundation-20261015

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security-scan.yml
  speaker-security:
    # Exercise the complete runtime, including verified model bytes and offline inference.
    uses: ./.github/workflows/security-scan.yml
    with:
      image-context: speaker-service
      audit-node: false
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: panthorium_ci_only
          POSTGRES_DB: panthorium_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d panthorium_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.3
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Syntax checks
        run: npm run check
      - name: Notebook storage, proxy and deployment recovery
        run: |
          node test/local-provider.js
          python3 -m pip install --user fastapi==0.141.1 httpx==0.28.1 psutil==7.2.2 python-multipart==0.0.32 Pillow==13.0.0
          node test/local-queue-workflow.js
          python3 -m unittest discover -s deploy/hybrid -p 'test_*.py'
          node test/hybrid-ai.js
          node test/hybrid-http.js
          node test/voice-style.js
          python3 -m py_compile deploy/hybrid/hybrid_server.py deploy/hybrid/host/voice/voice_engine.py
          node test/notebook-runtime.js
          python3 -m unittest discover -s ops/notebook -p 'test_*.py'
      - name: Free public-source live smoke (advisory)
        continue-on-error: true
        timeout-minutes: 2
        env:
          PANTHORIUM_TEST_PUBLIC_WEB_LIVE: '1'
        run: node test/public-web-live.js
      - name: Install media test dependency
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            # APT still verifies Ubuntu's signed InRelease/package hashes.
            # Probe mirrors before replacing the runner's list: both Canonical
            # hostnames can be unavailable to an individual runner's DNS.
            # https://documentation.ubuntu.com/security/software-integrity/archive-verification/
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              media_mirror=""
              for media_candidate in https://archive.ubuntu.com/ubuntu/ https://azure.archive.ubuntu.com/ubuntu/ https://mirrors.edge.kernel.org/ubuntu/; do
                if curl --silent --show-error --fail --head --connect-timeout 5 --max-time 10 "${media_candidate}dists/noble/InRelease" >/dev/null; then
                  media_mirror="$media_candidate"
                  break
                fi
              done
              if [ -z "$media_mirror" ]; then
                echo "No Ubuntu archive mirror is reachable; media tests cannot run." >&2
                exit 1
              fi
              printf '%s\tpriority:1\n' "$media_mirror" | sudo tee /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update -qq
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
      - name: Real PostgreSQL foundation and organization integration
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:panthorium_ci_only@127.0.0.1:5432/panthorium_ci
      - name: Run tests including security regressions
        run: npm test
      - name: Social media real browser audio and video
        run: |
          npx --no-install playwright install --with-deps --only-shell chromium
          node test/hybrid-voice-browser.js
          node test/speech-buffer-browser.js
          node test/guest-start-menu-browser.js
          node test/social-experience-browser.js
          node test/social-rtc-browser.js
          node test/social-messages-browser.js
          node test/social-groups-browser.js
          node test/contact-browser.js
          node test/social-notifications-browser.js
          node test/notifications-browser.js
          node test/user-mailbox-browser.js
          node test/social-redesign-browser.js
          node test/social-watch-browser.js
          node test/social-tv-browser.js
          node test/office-suite-browser.js
          node test/creative-workspace-browser.js
          node test/creative-inline-browser.js
          node test/creative-editing-workflows-browser.js
          node test/creative-voice-browser.js
          node test/work-assistant-browser.js
      - name: Speaker service contract tests
        run: |
          python3 -m pip install --user numpy==1.26.4
          python3 -m unittest discover -s speaker-service -p 'test_*.py'
