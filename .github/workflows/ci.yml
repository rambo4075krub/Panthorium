name: Panthorium CI

on:
  push:
    branches:
      - main
      - staging
      - phase5-agent-platform
  pull_request:
    branches:
      - main
      - staging

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Syntax checks
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Speaker service contract tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python3 -m pip install --user numpy==1.26.4
          python3 -m unittest discover -s speaker-service -p 'test_*.py'
