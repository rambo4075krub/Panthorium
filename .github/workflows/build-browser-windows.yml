name: Build Panthorium Browser
# Electron speech bridge build: renderer-safe upload via main process

on:
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/create-browser-update-manifests.js"
      - "scripts/desktop-release-version.js"
      - "test/security-*.js"
      - "panthorium-logo*.svg"
      - "panthorium-logo*.png"
      - ".github/workflows/build-browser-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panthorium-browser-production
  cancel-in-progress: false

jobs:
  security:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security-scan.yml
    with:
      scan-container: false
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: version
        run: node scripts/desktop-release-version.js >> "$GITHUB_OUTPUT"
  desktop-installer:
    if: github.ref == 'refs/heads/main'
    needs: [security, version]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        edition: [admin, user]
        include:
          - os: windows-latest
            platform: windows
            target: "--win nsis"
            artifact_path: "dist/*.exe"
            artifact_name: "Panthorium-Browser-Windows"
          - os: macos-latest
            platform: macos
            target: "--mac dmg"
            artifact_path: "dist/*.dmg"
            artifact_name: "Panthorium-Browser-macOS"
          - os: ubuntu-latest
            platform: linux
            target: "--linux AppImage"
            artifact_path: "dist/*.AppImage"
            artifact_name: "Panthorium-Browser-Linux"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Render original Panthorium logo
        shell: bash
        run: |
          node -e "const fs=require('fs'); const {Resvg}=require('@resvg/resvg-js'); const svg=fs.readFileSync('panthorium-logo.svg','utf8'); const png=new Resvg(svg,{fitTo:{mode:'width',value:512}}).render().asPng(); fs.mkdirSync('build',{recursive:true}); fs.writeFileSync('build/icon.png',png);"

      - name: Build desktop installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DESKTOP_RELEASE_VERSION: ${{ needs.version.outputs.release }}
        run: |
          for attempt in 1 2 3; do
            if npx --no-install electron-builder ${{ matrix.target }} --publish never -c.appId=com.panthorium.browser.${{ matrix.edition }} -c.productName="Panthorium Browser ${{ matrix.edition }}" -c.nsis.shortcutName="Panthorium Browser ${{ matrix.edition }}" -c.extraMetadata.panthoriumEdition=${{ matrix.edition }} -c.extraMetadata.version="$DESKTOP_RELEASE_VERSION" -c.artifactName='Panthorium-Browser-${{ matrix.edition }}-${version}-${{ matrix.platform }}-${arch}.${ext}'; then
              exit 0
            fi
            echo "electron-builder failed; retry $attempt/3"
            sleep 15
          done
          exit 1

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}-${{ matrix.edition }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  publish-staging-release:
    if: github.ref == 'refs/heads/main'
    needs: [desktop-installer, version]
    # Build/install scripts run in separate read-only jobs without release secrets.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node.js for manifest signing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1

      - name: Download desktop installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Panthorium-Browser-*
          path: dist
          merge-multiple: true

      - name: Create verified update manifests
        # Provision a private key only after its public key is committed to
        # electron/update-trust.json. The signer fails closed without both.
        env:
          PANTHORIUM_DESKTOP_RELEASE_VERSION: ${{ needs.version.outputs.release }}
          PANTHORIUM_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.PANTHORIUM_UPDATE_SIGNING_PRIVATE_KEY }}
          PANTHORIUM_UPDATE_SIGNING_KEY_ID: ${{ vars.PANTHORIUM_UPDATE_SIGNING_KEY_ID }}
        run: node scripts/create-browser-update-manifests.js dist

      - name: Publish browser release (legacy updater URL)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: staging
          name: Panthorium Browser
          prerelease: false
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
