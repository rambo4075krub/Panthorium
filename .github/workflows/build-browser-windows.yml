name: Build Panthorium Browser
# Electron speech bridge build: renderer-safe upload via main process

on:
  push:
    branches: [staging]
    paths:
      - "electron/**"
      - "package.json"
      - ".github/workflows/build-browser-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-installer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        edition: [admin, user]
        include:
          - os: windows-latest
            target: "--win nsis"
            artifact_path: "dist/*.exe"
            artifact_name: "Panthorium-Browser-Windows"
          - os: macos-latest
            target: "--mac dmg"
            artifact_path: "dist/*.dmg"
            artifact_name: "Panthorium-Browser-macOS"
          - os: ubuntu-latest
            target: "--linux AppImage"
            artifact_path: "dist/*.AppImage"
            artifact_name: "Panthorium-Browser-Linux"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install packaging tools
        shell: bash
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for attempt in 1 2 3; do
            if npm install --no-save --package-lock=false electron@36.9.5 @resvg/resvg-js@2.6.2; then
              exit 0
            fi
            echo "Packaging dependency download failed; retry $attempt/3"
            sleep 10
          done
          exit 1

      - name: Render Panthorium orange logo
        shell: bash
        run: |
          node -e "const fs=require('fs'); const {Resvg}=require('@resvg/resvg-js'); const svg=fs.readFileSync('panthorium-logo.svg','utf8'); const png=new Resvg(svg,{fitTo:{mode:'width',value:512}}).render().asPng(); fs.mkdirSync('build',{recursive:true}); fs.writeFileSync('build/icon.png',png);"

      - name: Build desktop installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          for attempt in 1 2 3; do
            if npx --yes electron-builder@26.0.12 ${{ matrix.target }} --publish never -c.appId=com.panthorium.browser.${{ matrix.edition }} -c.productName="Panthorium Browser ${{ matrix.edition }}" -c.nsis.shortcutName="Panthorium Browser ${{ matrix.edition }}" -c.extraMetadata.panthoriumEdition=${{ matrix.edition }} -c.artifactName='Panthorium-Browser-${{ matrix.edition }}-${version}-${arch}.${ext}'; then
              exit 0
            fi
            echo "electron-builder failed; retry $attempt/3"
            sleep 15
          done
          exit 1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ matrix.edition }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  publish-staging-release:
    needs: desktop-installer
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: Panthorium-Browser-*
          path: dist
          merge-multiple: true

      - name: Publish staging browser release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging
          name: Panthorium Browser (Staging)
          prerelease: true
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
