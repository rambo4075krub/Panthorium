name: Build Panthorium Browser

on:
  push:
    branches: [staging]
    paths:
      - "electron/**"
      - "package.json"
      - ".github/workflows/build-browser-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run package:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Panthorium-Browser-Windows
          path: dist/Panthorium-Browser-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
