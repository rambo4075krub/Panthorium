name: Dependency and container security

on:
  workflow_call:
    inputs:
      scan-container:
        description: Build and scan the deployable container
        type: boolean
        default: true
      image-context:
        description: Container build directory (backend or speaker service)
        type: string
        default: .
      audit-node:
        description: Audit the backend, browser and Android lockfiles
        type: boolean
        default: true

# This workflow never receives cloud credentials or signing secrets.
permissions:
  contents: read

jobs:
  dependencies:
    if: inputs.audit-node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: [., mobile/android]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Audit locked runtime and build dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=high --ignore-scripts

  container:
    if: inputs.scan-container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image for security inspection
        env:
          BUILD_CONTEXT: ${{ inputs.image-context }}
        run: |
          set -euo pipefail
          [[ "$BUILD_CONTEXT" == "." || "$BUILD_CONTEXT" == "speaker-service" ]]
          docker build --pull --tag "panthorium-security:$GITHUB_SHA" "$BUILD_CONTEXT"
      - name: Scan image for high and critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: panthorium-security:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: json
          output-file: ${{ runner.temp }}/container-vulnerabilities.json
      - name: Preserve image vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-security-${{ github.job }}
          path: ${{ runner.temp }}/container-vulnerabilities.json
          if-no-files-found: ignore
          retention-days: 14
