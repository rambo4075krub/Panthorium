name: Speaker complete runtime candidate

on:
  pull_request:
    paths:
      - speaker-service/**
      - build/media/**
      - build/libsndfile/**
      - scripts/verify-container-sbom.js
      - scripts/verified-ffmpeg-backport.js
      - .github/workflows/speaker-service-candidate.yml
      - .github/actions/verify-deployment-image/**
      - .github/actions/verify-speaker-runtime/**

# No deployment credentials, publishing, exclusions, or production gate changes.
permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Test integrity checks
        run: |
          python3 -m unittest discover -s speaker-service/experimental -p 'test_*.py' -v
          node test/security-container-sbom.js
          node test/security-verified-backport.js
      - name: Prepare evidence
        run: |
          echo "EVIDENCE_DIR=$RUNNER_TEMP/speaker-service-candidate" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build complete service with coherent native libraries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: speaker-service/Dockerfile
          target: runtime-service
          tags: speaker-service-candidate:${{ github.sha }}
          pull: true
          load: true
          push: false
          cache-from: type=gha,scope=speaker-complete-candidate
          cache-to: type=gha,mode=max,scope=speaker-complete-candidate,ignore-error=true,timeout=3m
      - name: Verify the exact complete speaker image
        uses: ./.github/actions/verify-deployment-image
        with:
          image: speaker-service-candidate:${{ github.sha }}
          profile: speaker-candidate-noble
          evidence-dir: ${{ env.EVIDENCE_DIR }}
          require-model: 'true'
      - name: Preserve complete service evaluation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: speaker-complete-candidate
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14
