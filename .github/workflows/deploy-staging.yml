name: Deploy Staging
on:
  push:
    branches: [staging]
permissions:
  contents: read
  id-token: write
concurrency:
  group: panthorium-staging
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      PROJECT: ${{ vars.STAGING_GCP_PROJECT_ID }}
      DEPLOY_SA: ${{ vars.STAGING_DEPLOY_SA }}
      WIF_PROVIDER: ${{ vars.STAGING_WIF_PROVIDER }}
      RUNTIME_SA: ${{ vars.STAGING_RUNTIME_SA }}
      SQL_INSTANCE: ${{ vars.STAGING_SQL_INSTANCE }}
      RESEND_SECRET: ${{ vars.STAGING_RESEND_SECRET || '' }}
      EMAIL_FROM_ADDRESS: ${{ vars.STAGING_EMAIL_FROM || '' }}
      VERTEX_PROJECT: project-0f6aa7d0-6055-420f-842
      VERTEX_TUNING_JOB_LOCATION: europe-west4
      VERTEX_TUNING_JOB_ID: '3837217584332144640'
      VERTEX_MODEL: sentinel-v4
      VERTEX_EVALUATOR_MODELS: ${{ vars.STAGING_SENTINEL_VERTEX_EVALUATOR_MODELS || 'gemini-3.5-flash,gemini-3.1-flash-lite' }}
      VERTEX_EVALUATOR_LOCATION: ${{ vars.STAGING_SENTINEL_VERTEX_EVALUATOR_LOCATION || 'eu' }}
      REGION: asia-southeast1
      SERVICE: panthorium-backend-staging
      PANTHORIUM_FILES_BUCKET: ${{ vars.PANTHORIUM_STAGING_FILES_BUCKET || '' }}
      PANTHORIUM_PRODUCTION_FILES_BUCKET: ${{ vars.PANTHORIUM_PRODUCTION_FILES_BUCKET || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated staging configuration
        env:
          PRODUCTION_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in PROJECT RUNTIME_SA SQL_INSTANCE DEPLOY_SA WIF_PROVIDER PANTHORIUM_FILES_BUCKET PANTHORIUM_PRODUCTION_FILES_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing staging configuration: $name. See docs/STAGING.md"
              exit 1
            fi
          done
          if [ "$PROJECT" = "project-0f6aa7d0-6055-420f-842" ] || [ "$PROJECT" = "$PRODUCTION_PROJECT" ]; then
            echo "::error::Staging requires a separate GCP project"
            exit 1
          fi
          [[ "$PROJECT" == "panthorium-staging" ]]
          [[ "$DEPLOY_SA" == "staging-deployer@$PROJECT.iam.gserviceaccount.com" ]]
          [[ "$WIF_PROVIDER" == "projects/124818950958/locations/global/workloadIdentityPools/github-staging/providers/github" ]]
          [[ "$RUNTIME_SA" == *"@$PROJECT.iam.gserviceaccount.com" ]]
          [[ "$SQL_INSTANCE" == "$PROJECT:$REGION:"* ]]
          bucket_pattern='^[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$'
          if ! [[ "$PANTHORIUM_FILES_BUCKET" =~ $bucket_pattern ]] || ! [[ "$PANTHORIUM_PRODUCTION_FILES_BUCKET" =~ $bucket_pattern ]]; then
            echo "::error::Set valid Cloud Storage bucket names in the repository variables."
            exit 1
          fi
          if [ "$PANTHORIUM_FILES_BUCKET" = "$PANTHORIUM_PRODUCTION_FILES_BUCKET" ]; then
            echo "::error::Staging and production must use different Cloud Storage buckets."
            exit 1
          fi
          configured=0
          for name in VERTEX_PROJECT VERTEX_TUNING_JOB_LOCATION VERTEX_TUNING_JOB_ID; do
            if [ -n "${!name}" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 3 ]; then
            echo "::error::Configure the Vertex project and tuning job resource"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          project_id: ${{ env.PROJECT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify optional staging email secret
        run: |
          set -euo pipefail
          if [ -n "$RESEND_SECRET" ] || [ -n "$EMAIL_FROM_ADDRESS" ]; then
            test -n "$RESEND_SECRET" && test -n "$EMAIL_FROM_ADDRESS"
            [[ "$RESEND_SECRET" =~ ^[A-Za-z0-9_-]+$ ]]
            gcloud secrets describe "$RESEND_SECRET" --project="$PROJECT" >/dev/null
          fi
      - name: Build and deploy isolated staging
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/panthorium-staging/backend:$GITHUB_SHA"
          gcloud builds submit --project="$PROJECT" --region="$REGION" --config=cloudbuild.staging.yaml --service-account="projects/$PROJECT/serviceAccounts/124818950958-compute@developer.gserviceaccount.com" --gcs-source-staging-dir="gs://${PROJECT}_cloudbuild/source" --substitutions="_IMAGE_URI=$IMAGE" --quiet .
          gcloud run deploy "$SERVICE" --project="$PROJECT" --region="$REGION" \
            --image="$IMAGE" --service-account="$RUNTIME_SA" --allow-unauthenticated \
            --port=8787 --max-instances=1 --min-instances=0 --cpu-throttling \
            --set-cloudsql-instances="$SQL_INSTANCE" \
            --update-env-vars="^@^NODE_ENV=production@HOST=0.0.0.0@TRUST_PROXY=1@DATABASE_SSL_MODE=disable@ALLOW_ELECTRON_ORIGIN=1@SENTINEL_AUTO_TRAINING=0@SENTINEL_AUTO_CAPTURE=0@SENTINEL_RELEASE_GATE_AUTO_GATE=0@SENTINEL_RELEASE_GATE_AUTO_BENCHMARK=0@SENTINEL_RELEASE_GATE_AUTO_IMPROVE=0@PANTHORIUM_GOVERNANCE_MODE=off@PANTHORIUM_SENTINEL_CONTROL_MODE=off@AI_PRIORITY=vertex@SENTINEL_VERTEX_PROJECT_ID=$VERTEX_PROJECT@SENTINEL_VERTEX_LOCATION=$VERTEX_TUNING_JOB_LOCATION@SENTINEL_VERTEX_EVALUATOR_LOCATION=$VERTEX_EVALUATOR_LOCATION@SENTINEL_VERTEX_TUNING_JOB_LOCATION=$VERTEX_TUNING_JOB_LOCATION@SENTINEL_VERTEX_TUNING_JOB_ID=$VERTEX_TUNING_JOB_ID@SENTINEL_VERTEX_MODEL=$VERTEX_MODEL@SENTINEL_VERTEX_EVALUATOR_MODELS=$VERTEX_EVALUATOR_MODELS@SENTINEL_VERTEX_AUDIO_MODEL=gemini-2.5-flash-lite@SENTINEL_VERTEX_AUDIO_LOCATION=europe-west4@SENTINEL_TEACHER_PROVIDERS=vertex@SENTINEL_EVALUATOR_PROVIDERS=vertex_eval_1,vertex_eval_2@SENTINEL_MIN_EVALUATORS=2@SENTINEL_AUTONOMOUS_PROMOTION_ENABLED=1@PANTHORIUM_FILES_BUCKET=$PANTHORIUM_FILES_BUCKET@BIOMETRIC_GATE_ENABLED=1@BIOMETRIC_VOICE_THRESHOLD=0.13@GEMINI_LIVE_ENABLED=1@GEMINI_LIVE_LOCATION=us-central1@BIOMETRIC_DIAGNOSTICS_ENABLED=1" \
            --update-secrets="DATABASE_URL=panthorium-staging-database-url:latest,JWT_SECRET=panthorium-staging-jwt:latest,ADMIN_PASSWORD=panthorium-staging-admin-password:latest" \
            --remove-secrets=GROQ_API_KEY,OPENAI_API_KEY,GEMINI_API_KEY,ANTHROPIC_API_KEY --quiet
          if [ -n "$RESEND_SECRET" ]; then
            gcloud run services update "$SERVICE" --project="$PROJECT" --region="$REGION" \
              --update-secrets="RESEND_API_KEY=$RESEND_SECRET:latest" \
              --update-env-vars="EMAIL_FROM=$EMAIL_FROM_ADDRESS" --quiet
          else
            echo "::warning::Email OTP is unavailable until STAGING_RESEND_SECRET and STAGING_EMAIL_FROM are configured."
          fi
          URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.url)')
          # Keep the Cloud Run service URL and the installed Electron staging
          # URL in the exact CORS allowlist. Local origins are limited to the
          # two documented development ports.
          gcloud run services update "$SERVICE" --project="$PROJECT" --region="$REGION" --update-env-vars="ALLOWED_ORIGINS=$URL" --quiet
          curl --fail --silent --show-error "$URL/health" | python3 -c 'import json,sys; health=json.load(sys.stdin); assert health.get("ok") is True, "staging database, Cloud Storage IAM, or Vertex readiness failed"'
          curl --fail --silent --show-error "$URL/admin" -o /dev/null
          curl --fail --silent --show-error "$URL/" -o "$RUNNER_TEMP/staging-home.html"
          grep -q 'data-gemini-live-enabled="true"' "$RUNNER_TEMP/staging-home.html"
          # Verify the running revision serves the files that passed the DOM and
          # routing tests, rather than treating a green health check as UI proof.
          for asset in voice-window-catalog.js external-apps-ui.js voice-command-client.js live-voice-client.js voice-identity-ui.js phase2-auth.js ai-stream-client.js; do
            curl --fail --silent --show-error "$URL/$asset" -o "$RUNNER_TEMP/deployed-$asset"
            cmp "$asset" "$RUNNER_TEMP/deployed-$asset"
          done
          if ! STAGING_URL="$URL" node test/voice-deployed.js; then
            echo "Recent Gemini Live staging diagnostics:" >&2
            gcloud logging read \
              'resource.type="cloud_run_revision" AND resource.labels.service_name="panthorium-backend-staging" AND resource.labels.location="asia-southeast1" AND textPayload:"[Gemini Live]"' \
              --project="$PROJECT" --freshness=10m --limit=20 --format='value(timestamp,textPayload)' || true
            exit 1
          fi
          echo "Staging admin: $URL/admin" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit tested: $GITHUB_SHA. Await owner voice acceptance before merging main." >> "$GITHUB_STEP_SUMMARY"

