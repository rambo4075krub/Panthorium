name: Deploy Speaker Service Staging
on:
  push:
    branches: [staging]
    paths:
      - speaker-service/**
      - build/media/**
      - .gcloudignore
      - .dockerignore
      - .github/workflows/security-scan.yml
      - cloudbuild.speaker.staging.yaml
      - .github/workflows/deploy-speaker-staging.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: panthorium-speaker-staging
  cancel-in-progress: false
jobs:
  security:
    if: github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/security-scan.yml
    with:
      image-context: speaker-service
      audit-node: false
  speaker:
    if: github.ref == 'refs/heads/staging'
    needs: security
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      PROJECT: ${{ vars.STAGING_GCP_PROJECT_ID }}
      DEPLOY_SA: ${{ vars.STAGING_DEPLOY_SA }}
      WIF_PROVIDER: ${{ vars.STAGING_WIF_PROVIDER }}
      RUNTIME_SA: ${{ vars.STAGING_RUNTIME_SA }}
      REGION: asia-southeast1
      SERVICE: panthorium-speaker-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify isolated project
        run: |
          set -euo pipefail
          [[ "$PROJECT" == "panthorium-staging" ]]
          [[ "$DEPLOY_SA" == "staging-deployer@$PROJECT.iam.gserviceaccount.com" ]]
          [[ "$RUNTIME_SA" == *"@$PROJECT.iam.gserviceaccount.com" ]]
          [[ -n "$WIF_PROVIDER" ]]
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Build and deploy private speaker service
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/panthorium-staging/speaker:$GITHUB_SHA"
          gcloud builds submit . --project="$PROJECT" --region="$REGION" \
            --config=cloudbuild.speaker.staging.yaml \
            --service-account="projects/$PROJECT/serviceAccounts/124818950958-compute@developer.gserviceaccount.com" \
            --gcs-source-staging-dir="gs://${PROJECT}_cloudbuild/source" \
            --substitutions="_IMAGE_URI=$IMAGE" --quiet
          gcloud run deploy "$SERVICE" --project="$PROJECT" --region="$REGION" \
            --image="$IMAGE" --service-account="$RUNTIME_SA" --no-allow-unauthenticated \
            --memory=2Gi --cpu=2 --concurrency=2 --timeout=60 --min-instances=0 --max-instances=1 --quiet
          gcloud run services add-iam-policy-binding "$SERVICE" --project="$PROJECT" --region="$REGION" \
            --member="serviceAccount:$RUNTIME_SA" --role="roles/run.invoker" --quiet
          URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.url)')
          [[ "$URL" == https://* ]]
          gcloud run services update panthorium-backend-staging --project="$PROJECT" --region="$REGION" \
            --update-env-vars="BIOMETRIC_SPEAKER_URL=$URL" --quiet
          echo "Speaker service deployed privately; backend bound to its URL. Live voice enrollment and threshold calibration remain required." >> "$GITHUB_STEP_SUMMARY"
