name: Publish notebook release
on:
  workflow_run:
    workflows: ["Panthorium CI"]
    types: [completed]
    branches: [main, staging]
permissions:
  contents: read
concurrency:
  group: notebook-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No checkout, artifacts, local server credentials, or PR code execution.
      - name: Publish the exact tested branch head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import json, os, re, urllib.request, urllib.error
          event=json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          run=event["workflow_run"]
          branch=run["head_branch"]
          if branch not in ("main","staging"):raise SystemExit("Unexpected branch")
          sha=run["head_sha"]
          if not re.fullmatch("[0-9a-f]{40}",sha):raise SystemExit("Invalid SHA")
          repo=os.environ["REPOSITORY"]
          if repo!="rambo4075krub/Panthorium":raise SystemExit("Unexpected repository")
          base="https://api.github.com/repos/"+repo
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def api(path,method="GET",data=None):
              body=json.dumps(data).encode() if data is not None else None
              with urllib.request.urlopen(urllib.request.Request(base+path,data=body,method=method,headers=headers),timeout=30) as response:
                  return json.load(response)
          head=api("/git/ref/heads/"+branch)["object"]["sha"]
          if head!=sha:
              print("A newer commit exists; this run will not deploy.")
              raise SystemExit(0)
          stage="production" if branch=="main" else "staging"
          ref="heads/deploy/notebook-"+stage
          try:
              previous=api("/git/ref/"+ref)["object"]["sha"]
          except urllib.error.HTTPError as error:
              if error.code!=404:raise
              previous=None
          if previous!=sha:
              if previous is None:
                  api("/git/refs","POST",{"ref":"refs/"+ref,"sha":sha})
              else:
                  api("/git/refs/"+ref,"PATCH",{"sha":sha,"force":False})
          print("CI passed. Notebook will receive",stage,sha)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:
              summary.write("Approved "+stage+" commit "+sha+". The notebook polls this ref every minute and records actual activation locally.\n")
