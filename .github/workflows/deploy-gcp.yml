name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGION: asia-southeast1
  SERVICE_NAME: panthorium-backend
  REPOSITORY_NAME: panthorium

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install & Run Tests
        run: |
          npm install
          npm run check
          npm test

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create Artifact Registry Repository (if not exists)
        run: |
          gcloud artifacts repositories create ${{ env.REPOSITORY_NAME }} \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --description="Panthorium Docker Repository" \
            --quiet || true

      - name: Build & Push via Cloud Build
        run: |
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          gcloud builds submit \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --config=cloudbuild.yaml \
            --substitutions="_IMAGE_URI=$IMAGE_URI" \
            --region=${{ env.REGION }} \
            --quiet .

      - name: Deploy to Cloud Run
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_URI" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8787 \
            --update-env-vars NODE_ENV=production,HOST=0.0.0.0 \
            --quiet
