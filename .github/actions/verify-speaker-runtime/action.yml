name: Verify complete Noble speaker image
description: Bind complete inventory, native/model checks and reviewed source evidence to one immutable image
inputs:
  image:
    description: Local image or immutable Artifact Registry digest
    required: true
  evidence-dir:
    description: Fresh directory below RUNNER_TEMP
    required: true
  pull:
    description: Pull an immutable registry image
    default: 'false'
  require-model:
    description: Full model verification is mandatory
    required: true
outputs:
  image-id:
    description: Image verified by every check
    value: ${{ steps.image.outputs.id }}
runs:
  using: composite
  steps:
  - name: Capture immutable image and source evidence
    id: image
    env:
      IMAGE: ${{ inputs.image }}
      PULL_IMAGE: ${{ inputs.pull }}
      REQUIRE_MODEL: ${{ inputs.require-model }}
      EVIDENCE_DIR: ${{ inputs.evidence-dir }}
    run: |
      set -euo pipefail
      [[ "$PULL_IMAGE" == false || "$PULL_IMAGE" == true ]]
      [[ "$REQUIRE_MODEL" == true ]]
      [[ "$IMAGE" =~ ^[a-z0-9][a-zA-Z0-9._:/@-]+$ ]]
      [[ "$(realpath -m "$EVIDENCE_DIR")" == "$RUNNER_TEMP/"* ]]
      mkdir "$EVIDENCE_DIR"
      if [ "$PULL_IMAGE" == true ]; then
        [[ "$IMAGE" =~ ^[a-z][a-z0-9-]*-docker\.pkg\.dev/[^@]+@sha256:[a-f0-9]{64}$ ]]
        docker pull "$IMAGE"
      fi
      docker image inspect "$IMAGE" > "$EVIDENCE_DIR/image-inspect.json"
      if [ "$PULL_IMAGE" == true ]; then
        node scripts/resolve-build-image.js inspect "$EVIDENCE_DIR/image-inspect.json" "$IMAGE"
      fi
      IMAGE_ID="$(node -e 'const assert=require("node:assert/strict"),fs=require("node:fs");const images=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));assert.equal(images.length,1);const i=images[0];assert.match(i.Id,/^sha256:[a-f0-9]{64}$/);assert.equal(i.Os,"linux");assert.equal(i.Architecture,"amd64");assert.equal(i.Config.User,"10001:10001");assert.deepEqual(i.Config.Entrypoint,["/opt/venv/bin/python"]);assert.deepEqual(i.Config.Cmd,["runtime_guard.py"]);assert.equal(i.Config.WorkingDir,"/app");console.log(i.Id)' "$EVIDENCE_DIR/image-inspect.json")"
      echo "id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
      container_id=$(docker create "$IMAGE_ID")
      trap 'docker rm "$container_id" >/dev/null' EXIT
      docker cp "$container_id:/var/lib/dpkg/status" "$EVIDENCE_DIR/dpkg-status.txt"
      docker cp "$container_id:/var/lib/dpkg/info" - > "$EVIDENCE_DIR/dpkg-info.tar"
      docker cp "$container_id:/var/lib/chisel" "$EVIDENCE_DIR/chisel"
      docker cp "$container_id:/usr/local/share/panthorium/." "$EVIDENCE_DIR/"
      docker cp "$container_id:/usr/local/bin/ffmpeg" "$EVIDENCE_DIR/ffmpeg"
      docker cp "$container_id:/usr/local/bin/ffprobe" "$EVIDENCE_DIR/ffprobe"
      docker cp "$container_id:/usr/lib/x86_64-linux-gnu/libsndfile.so.1.0.37" "$EVIDENCE_DIR/libsndfile.so.1.0.37"
      printf 'ignore: []\nmatch-upstream-kernel-headers: true\n' > "$EVIDENCE_DIR/grype.yaml"
    shell: bash
  - name: Verify complete filesystem without permitting writes
    id: filesystem
    env:
      IMAGE_ID: ${{ steps.image.outputs.id }}
      EVIDENCE_DIR: ${{ inputs.evidence-dir }}
    run: |
      set -euo pipefail
      docker run --rm --network none --read-only --user 0 --cap-drop ALL --cap-add DAC_OVERRIDE \
        --security-opt no-new-privileges --entrypoint /opt/venv/bin/python "$IMAGE_ID" /app/experimental/verify-service.py --verify \
        | tee "$EVIDENCE_DIR/filesystem-proof.json"
    shell: bash
  - name: Test actual audio decoders and CPU imports
    env:
      IMAGE_ID: ${{ steps.image.outputs.id }}
      EVIDENCE_DIR: ${{ inputs.evidence-dir }}
    run: |
      set -euo pipefail
      docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
        --memory 2g --cpus 2 --entrypoint /opt/venv/bin/python "$IMAGE_ID" /app/test/container-speaker-media-smoke.py --candidate-noble \
        2>&1 | tee "$EVIDENCE_DIR/media-smoke.log"
    shell: bash
  - name: Test exact model with offline inference
    if: ${{ !cancelled() && steps.filesystem.outcome == 'success' }}
    env:
      IMAGE_ID: ${{ steps.image.outputs.id }}
      EVIDENCE_DIR: ${{ inputs.evidence-dir }}
    run: |
      set -euo pipefail
      timeout --kill-after=5s 180s docker run --rm --network none --cap-drop ALL \
        --security-opt no-new-privileges --memory 2g --cpus 2 \
        --entrypoint /opt/venv/bin/python "$IMAGE_ID" /app/test/container-speaker-model-smoke.py \
        2>&1 | tee "$EVIDENCE_DIR/model-smoke.log"
    shell: bash
  - name: Inventory the entire service image
    id: sbom
    if: ${{ !cancelled() && steps.filesystem.outcome == 'success' }}
    uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
    with:
      image: ${{ steps.image.outputs.id }}
      format: json
      output-file: ${{ inputs.evidence-dir }}/service-sbom.raw.syft.json
      upload-artifact: false
      upload-release-assets: false
      dependency-snapshot: false
  - name: Verify complete vendor package inventory and bind native sources
    id: provenance
    if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
    run: |
      set -euo pipefail
      python3 speaker-service/experimental/check-service-sbom.py "$EVIDENCE_DIR"
      node scripts/verify-container-sbom.js \
        "$EVIDENCE_DIR/service-sbom.with-native.syft.json" "$EVIDENCE_DIR/ffmpeg-source.json" \
        "$EVIDENCE_DIR" "$EVIDENCE_DIR/image-inspect.json" build/media/ffmpeg-speaker-source.lock.json \
        "$EVIDENCE_DIR/service-sbom.syft.json" "$EVIDENCE_DIR/ffmpeg-proof.json" speaker-candidate-noble
    shell: bash
    env:
      EVIDENCE_DIR: ${{ inputs.evidence-dir }}
  - name: Preserve the complete unfiltered full-image scan
    id: raw-scan
    if: ${{ !cancelled() && steps.provenance.outcome == 'success' }}
    uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
    with:
      grype-version: v0.118.0
      sbom: ${{ inputs.evidence-dir }}/service-sbom.syft.json
      config: ${{ inputs.evidence-dir }}/grype.yaml
      fail-build: false
      severity-cutoff: high
      only-fixed: false
      output-format: json
      output-file: ${{ inputs.evidence-dir }}/container-vulnerabilities.raw.json
  - name: Verify reviewed source and exact native executables for this image
    id: backport
    if: ${{ !cancelled() && steps.raw-scan.outcome == 'success' }}
    run: node scripts/verified-ffmpeg-backport.js create "$EVIDENCE_DIR"
    shell: bash
    env:
      EVIDENCE_DIR: ${{ inputs.evidence-dir }}
  - name: Require strict gate with only the verified backport
    id: filtered-scan
    if: ${{ !cancelled() && steps.backport.outcome == 'success' }}
    uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
    env:
      GRYPE_DB_AUTO_UPDATE: 'false'
    with:
      grype-version: v0.118.0
      sbom: ${{ inputs.evidence-dir }}/service-sbom.syft.json
      config: ${{ inputs.evidence-dir }}/grype.yaml
      vex: ${{ inputs.evidence-dir }}/ffmpeg-backport.vex.json
      fail-build: true
      severity-cutoff: high
      only-fixed: false
      output-format: json
      output-file: ${{ inputs.evidence-dir }}/container-vulnerabilities.json
  - name: Independently reject changed findings or unrelated exemptions
    if: ${{ !cancelled() && steps.backport.outcome == 'success' && steps.filtered-scan.outcome != 'skipped' }}
    run: node scripts/verified-ffmpeg-backport.js verify "$EVIDENCE_DIR"
    shell: bash
    env:
      EVIDENCE_DIR: ${{ inputs.evidence-dir }}
