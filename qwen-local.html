<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qwen 4B · Panthorium</title><style>body{font:1.05rem/1.6 system-ui,sans-serif;max-width:42rem;margin:3rem auto;padding:0 1.25rem;color:#172737}input,textarea,button{font:inherit;padding:.55rem}label,input,textarea{display:block}label,button{margin-top:1rem}textarea{width:95%}output{display:block;margin-top:1.4rem;white-space:pre-wrap}</style><script src="/qwen-local.js" defer></script></head>
<body><a href="/">กลับไป Panthorium</a><h1>สนทนากับ Qwen 4B</h1><form id="login"><label>ชื่อผู้ใช้หรืออีเมล Panthorium<input name="username" autocomplete="username" required></label><label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required></label><button>เข้าสู่ระบบ</button></form><form id="chat" hidden><label>ข้อความถึง Qwen<textarea name="message" rows="4" maxlength="2000" required></textarea></label><button>ส่งข้อความ</button><button type="button" id="cancel" hidden>ยกเลิกคำขอ</button></form><output aria-live="polite"></output></body></html>
