<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ตัวอย่าง Orb — อัญมณีบลูแซฟไฟร์เจียระไน (preview)</title>
  <style>
    html,body{margin:0;height:100%;background:#01030a;overflow:hidden;font-family:system-ui,sans-serif;color:#dce9ff}
    canvas{display:block;width:100%;height:100%}
    .hud{position:fixed;left:16px;top:16px;z-index:2;background:rgba(5,12,28,.78);border:1px solid rgba(15,82,186,.5);border-radius:12px;padding:12px 14px;max-width:340px;backdrop-filter:blur(8px)}
    .hud h1{margin:0 0 6px;font-size:15px;font-weight:600}
    .hud p{margin:0;font-size:12px;line-height:1.55;opacity:.88}
    .tag{display:inline-block;margin-top:8px;padding:3px 8px;border-radius:999px;border:1px solid rgba(91,141,239,.45);color:#9ec1ff;font-size:11px}
  </style>
</head>
<body>
  <div class="hud">
    <h1>อัญมณีบลูแซฟไฟร์เจียระไน</h1>
    <p>จุดที่เคลื่อนรอบลูก = แซฟไฟร์เจียระไน (มีเหลี่ยม + ประกาย)<br>ลากเมาส์หมุน · คลิกเพื่อ pulse<br><strong>หน้าตัวอย่างเท่านั้น</strong> — ยังไม่ใส่ระบบจริง</p>
    <span class="tag">preview only</span>
  </div>
  <canvas id="c"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script>
  (function () {
    const canvas = document.getElementById('c');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x01030a, .07);
    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .1, 100);
    camera.position.z = 4.2;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const group = new THREE.Group();
    scene.add(group);

    const count = innerWidth < 700 ? 7200 : 14000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const seeds = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      // thin shell around sphere so gems sit on / near the surface
      const y = 1 - (i / (count - 1)) * 2;
      const r0 = Math.sqrt(Math.max(0, 1 - y * y));
      const t = i * 2.399963;
      const shell = 0.92 + (Math.random() * 0.16);
      positions[i * 3] = Math.cos(t) * r0 * shell;
      positions[i * 3 + 1] = y * shell;
      positions[i * 3 + 2] = Math.sin(t) * r0 * shell;
      seeds[i] = Math.random();
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));

    const material = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uPulse: { value: 0 },
        uAI: { value: 0 },
        uVoice: { value: 0 },
        uPixel: { value: renderer.getPixelRatio() }
      },
      vertexShader: `
        uniform float uTime; uniform float uPulse; uniform float uAI; uniform float uVoice; uniform float uPixel;
        attribute float aSeed; varying float vGlow; varying float vSeed; varying vec3 vPos;
        void main(){
          vec3 p = position;
          float n = sin(p.x*8.0+uTime*1.9)*sin(p.y*7.0-uTime*1.3)*cos(p.z*9.0+uTime);
          n += .45*sin((p.x+p.y+p.z)*15.0-uTime*2.4+aSeed*6.28);
          float wave = uPulse*sin(length(p)*18.0-uTime*4.0);
          float aiWave = uAI*(sin(p.y*17.0-uTime*8.0)*.035+cos(p.x*13.0+uTime*6.0)*.02);
          float voiceWave = uVoice*sin((p.x+p.y+p.z)*19.0-uTime*10.0)*.014;
          p += normalize(p)*(n*.055+wave*.045+aiWave+voiceWave);
          p += .018*vec3(sin(uTime+p.y*12.0),cos(uTime*.8+p.z*11.0),sin(uTime*1.2+p.x*10.0));
          float pointGlow = .55+.45*n;
          vGlow = pointGlow - uPulse*.18;
          vSeed = aSeed;
          vPos = p;
          vec4 mv = modelViewMatrix*vec4(p,1.0);
          gl_Position = projectionMatrix*mv;
          // slightly larger, varied gem sizes
          float sizeJitter = 0.85 + 0.45*aSeed;
          gl_PointSize = uPixel * sizeJitter * (1.35 + 2.2*pow(max(pointGlow,0.0),2.0)) * (9.2 / -mv.z);
        }`,
      fragmentShader: `
        varying float vGlow; varying float vSeed; varying vec3 vPos;
        // regular hexagon distance (faceted silhouette)
        float hexDist(vec2 p){
          p = abs(p);
          return max(p.x*0.866025 + p.y*0.5, p.y);
        }
        void main(){
          vec2 uv = gl_PointCoord - 0.5;
          // slight per-gem rotation of the cut
          float ang = vSeed * 6.28318;
          float ca = cos(ang), sa = sin(ang);
          vec2 ruv = vec2(ca*uv.x - sa*uv.y, sa*uv.x + ca*uv.y);

          float d = hexDist(ruv * 1.15);
          if (d > 0.48) discard;

          // hard facet edges
          float edge = smoothstep(0.48, 0.42, d);
          float core = smoothstep(0.40, 0.08, d);

          // facet planes via angular sectors (like a brilliant cut)
          float a = atan(ruv.y, ruv.x);
          float facets = abs(fract((a / 6.28318) * 8.0 + vSeed) - 0.5);
          float facetShade = 0.55 + 0.45 * smoothstep(0.0, 0.5, facets);

          // table (flat top) highlight in center
          float table = smoothstep(0.22, 0.0, length(ruv));

          // blue sapphire body
          vec3 deep = vec3(0.03, 0.10, 0.38);
          vec3 sapphire = vec3(0.08, 0.28, 0.78);
          vec3 bright = vec3(0.35, 0.55, 0.98);
          vec3 ice = vec3(0.88, 0.94, 1.0);

          float side = smoothstep(-1.0, 1.0, vPos.x + vPos.y * 0.35);
          vec3 col = mix(deep, sapphire, side * 0.85 + 0.15);
          col = mix(col, bright, facetShade * 0.55 * core);
          col = mix(col, ice, table * (0.45 + 0.35 * max(vGlow, 0.0)));

          // specular sparkles on facet corners
          float spark = pow(1.0 - facets, 12.0) * core;
          spark *= 0.35 + 0.65 * (0.5 + 0.5 * sin(vPos.x * 20.0 + vPos.y * 17.0 + vSeed * 9.0));
          col += ice * spark * 1.4;

          // rim of the cut stone
          float rim = smoothstep(0.35, 0.48, d) * edge;
          col = mix(col, bright * 1.1, rim * 0.35);

          float alpha = edge * (0.35 + core * 0.55 + spark * 0.4 + max(vGlow, 0.0) * 0.25);
          gl_FragColor = vec4(col, clamp(alpha, 0.0, 1.0));
        }`,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const points = new THREE.Points(geometry, material);
    group.add(points);

    // soft inner glow (not particles)
    const core = new THREE.Mesh(
      new THREE.SphereGeometry(0.72, 48, 48),
      new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uPulse: { value: 0 } },
        transparent: true,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: `varying vec3 vN; varying vec3 vP; void main(){vN=normalize(normalMatrix*normal);vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
        fragmentShader: `uniform float uTime;uniform float uPulse;varying vec3 vN;varying vec3 vP;void main(){float rim=pow(1.0-abs(vN.z),2.2);float bands=.5+.5*sin(vP.y*13.0+sin(vP.x*9.0+uTime)*2.0-uTime*2.0);vec3 c=mix(vec3(.02,.05,.18),vec3(.06,.22,.65),bands);gl_FragColor=vec4(c,max(.02,.07+rim*.28-uPulse*.04));}`
      })
    );
    group.add(core);

    let pulse = 0;
    const target = { x: 0, y: 0 };
    const current = { x: 0, y: 0 };
    canvas.addEventListener('pointermove', e => {
      target.y = (e.clientX / innerWidth - 0.5) * 0.72;
      target.x = (e.clientY / innerHeight - 0.5) * 0.5;
    });
    canvas.addEventListener('pointerdown', () => { pulse = 1; });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      material.uniforms.uPixel.value = renderer.getPixelRatio();
    });

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      pulse = Math.max(0, pulse - dt * 1.2);
      current.x += (target.x - current.x) * 0.06;
      current.y += (target.y - current.y) * 0.06;
      group.rotation.x = current.x;
      group.rotation.y = current.y + now * 0.00012;
      material.uniforms.uTime.value = now * 0.001;
      material.uniforms.uPulse.value = pulse;
      core.material.uniforms.uTime.value = now * 0.001;
      core.material.uniforms.uPulse.value = pulse;
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
