<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ตัวอย่าง Orb — Blue Sapphire (ยังไม่ใส่ repo)</title>
  <style>
    html,body{margin:0;height:100%;background:#01030a;overflow:hidden;font-family:system-ui,sans-serif;color:#dce9ff}
    canvas{display:block;width:100%;height:100%}
    .hud{position:fixed;left:16px;top:16px;z-index:2;background:rgba(5,12,28,.72);border:1px solid rgba(15,82,186,.45);border-radius:12px;padding:12px 14px;max-width:320px;backdrop-filter:blur(8px)}
    .hud h1{margin:0 0 6px;font-size:15px;font-weight:600}
    .hud p{margin:0;font-size:12px;line-height:1.5;opacity:.85}
    .swatches{display:flex;gap:8px;margin-top:10px}
    .sw{width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.2)}
  </style>
</head>
<body>
  <div class="hud">
    <h1>ตัวอย่างจุดบลูแซฟไฟร์</h1>
    <p>เฉพาะสีจุดอนุภาค (Points) — ยัง<strong>ไม่</strong>ถูกส่งเข้า Panthorium repo<br>ลากเมาส์หมุนลูก · คลิกเพื่อ pulse</p>
    <div class="swatches">
      <div class="sw" style="background:#0A287A" title="deep"></div>
      <div class="sw" style="background:#0F52D1" title="sapphire"></div>
      <div class="sw" style="background:#D1EBFF" title="ice highlight"></div>
    </div>
  </div>
  <canvas id="c"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script>
  (function () {
    const canvas = document.getElementById('c');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x01030a, .08);
    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .1, 100);
    camera.position.z = 4.2;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    const group = new THREE.Group();
    scene.add(group);

    const count = innerWidth < 700 ? 9000 : 18000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const seeds = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      const y = 1 - (i / (count - 1)) * 2;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const t = i * 2.399963;
      positions[i * 3] = Math.cos(t) * r;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = Math.sin(t) * r;
      seeds[i] = Math.random();
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));

    // === BLUE SAPPHIRE particle colors (preview only) ===
    const material = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uPulse: { value: 0 },
        uAI: { value: 0 },
        uVoice: { value: 0 },
        uPixel: { value: renderer.getPixelRatio() }
      },
      vertexShader: `
        uniform float uTime; uniform float uPulse; uniform float uAI; uniform float uVoice; uniform float uPixel;
        attribute float aSeed; varying float vGlow; varying vec3 vPos;
        void main(){
          vec3 p=position;
          float n=sin(p.x*8.0+uTime*1.9)*sin(p.y*7.0-uTime*1.3)*cos(p.z*9.0+uTime);
          n += .45*sin((p.x+p.y+p.z)*15.0-uTime*2.4+aSeed*6.28);
          float wave=uPulse*sin(length(p)*18.0-uTime*4.0);
          float aiWave=uAI*(sin(p.y*17.0-uTime*8.0)*.035+cos(p.x*13.0+uTime*6.0)*.02);
          float voiceWave=uVoice*sin((p.x+p.y+p.z)*19.0-uTime*10.0)*.014;
          p += normalize(p)*(n*.075+wave*.055+aiWave+voiceWave);
          p += .022*vec3(sin(uTime+p.y*12.0),cos(uTime*.8+p.z*11.0),sin(uTime*1.2+p.x*10.0));
          float pointGlow=.55+.45*n; vGlow=pointGlow-uPulse*.18; vPos=p;
          vec4 mv=modelViewMatrix*vec4(p,1.0); gl_Position=projectionMatrix*mv;
          gl_PointSize=uPixel*(1.15+2.4*pow(max(pointGlow,0.0),2.0))*(8.86578/-mv.z);
        }`,
      fragmentShader: `
        varying float vGlow; varying vec3 vPos;
        void main(){
          vec2 q=gl_PointCoord-.5; float d=length(q); if(d>.5) discard;
          float a=smoothstep(.5,.05,d);
          // Blue sapphire palette
          vec3 deep=vec3(.04,.16,.48);
          vec3 sapphire=vec3(.06,.32,.82);
          vec3 ice=vec3(.82,.92,1.0);
          float side=smoothstep(-1.0,1.0,vPos.x+vPos.y*.35);
          vec3 col=mix(deep,sapphire,side);
          col=mix(col,ice,clamp(vGlow*.65,0.0,1.0));
          float spark=.035*smoothstep(.35,1.0,.5+.5*sin((vPos.x-vPos.y+vPos.z)*11.0));
          col=mix(col,vec3(.92,.96,1.0),spark);
          gl_FragColor=vec4(col,a*(.21+max(vGlow,0.0)*.5));
        }`,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const points = new THREE.Points(geometry, material);
    group.add(points);

    // soft core matching sapphire (preview only)
    const core = new THREE.Mesh(
      new THREE.SphereGeometry(.77, 48, 48),
      new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uPulse: { value: 0 } },
        transparent: true,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: `varying vec3 vN; varying vec3 vP; void main(){vN=normalize(normalMatrix*normal);vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
        fragmentShader: `uniform float uTime;uniform float uPulse;varying vec3 vN;varying vec3 vP;void main(){float rim=pow(1.0-abs(vN.z),2.2);float bands=.5+.5*sin(vP.y*13.0+sin(vP.x*9.0+uTime)*2.0-uTime*2.0);vec3 c=mix(vec3(.02,.06,.22),vec3(.08,.35,.88),bands);gl_FragColor=vec4(c,max(.02,.08+rim*.3-uPulse*.045));}`
      })
    );
    group.add(core);

    let pulse = 0;
    const target = { x: 0, y: 0 };
    const current = { x: 0, y: 0 };
    canvas.addEventListener('pointermove', e => {
      target.y = (e.clientX / innerWidth - .5) * .72;
      target.x = (e.clientY / innerHeight - .5) * .5;
    });
    canvas.addEventListener('pointerdown', () => { pulse = 1; });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      material.uniforms.uPixel.value = renderer.getPixelRatio();
    });

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(.05, (now - last) / 1000);
      last = now;
      pulse = Math.max(0, pulse - dt * 1.2);
      current.x += (target.x - current.x) * .06;
      current.y += (target.y - current.y) * .06;
      group.rotation.x = current.x;
      group.rotation.y = current.y + now * .00012;
      material.uniforms.uTime.value = now * .001;
      material.uniforms.uPulse.value = pulse;
      core.material.uniforms.uTime.value = now * .001;
      core.material.uniforms.uPulse.value = pulse;
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
