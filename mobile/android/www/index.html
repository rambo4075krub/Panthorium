<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <title>Panthorium Browser</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #08090c; color: #f4f5f7; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; }
    main { max-width: 28rem; }
    .orb { width: 4rem; height: 4rem; margin: 0 auto 1.25rem; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3bf, #ff9d22 48%, #a93d00); box-shadow: 0 0 48px #ff8f2440; }
    h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
    p { color: #b7bdc8; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true"></div>
    <h1>กำลังเชื่อมต่อ Panthorium</h1>
    <p>โปรดตรวจสอบอินเทอร์เน็ต แล้วเปิดแอปอีกครั้ง</p>
  </main>
</body>
</html>
