<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#00ffcc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="/panthorium-logo.svg?v=original-orange-20261015">
    <link rel="apple-touch-icon" href="/panthorium-logo.png?v=original-orange-20261015">
    <title>Panthorium OS</title>
    <link rel="search" type="application/opensearchdescription+xml" title="Panthorium Search" href="/search/opensearch.xml">
    <style>
        :root {
            --accent: #00ffcc;
            --accent-dim: #00ccaa;
            --bg: #0a0a0f;
            --surface: rgba(20, 25, 35, 0.92);
            --surface-2: rgba(30, 38, 55, 0.95);
            --text: #e8f0ff;
            --text-dim: #8a9bb8;
            --danger: #ff4466;
            --success: #44ff99;
            --window-radius: 12px;
            --taskbar-h: 48px;
            --panthorium-native-safe-area-top: 0px;
            --panthorium-safe-area-top: max(env(safe-area-inset-top, 0px), var(--panthorium-native-safe-area-top, 0px));
            --panthorium-shell-dock-clearance: calc(var(--taskbar-h) + env(safe-area-inset-bottom, 0px) + 20px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text);
            user-select: none;
        }

        /* ========== BOOT SCREEN ========== */
        #boot-screen {
            position: fixed; inset: 0;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        #boot-screen.hidden { opacity: 0; pointer-events: none; }
        .boot-logo {
            width: 120px; height: 120px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            animation: none;
            margin-bottom: 28px;
        }
        .boot-logo inner {
            width: 60px; height: 60px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.35;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px var(--accent); }
            50% { box-shadow: 0 0 50px var(--accent), 0 0 80px rgba(0,255,204,0.3); }
        }
        .boot-title { font-size: 28px; font-weight: 300; letter-spacing: 6px; color: var(--accent); margin-bottom: 8px; }
        .boot-sub { font-size: 13px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 40px; }
        .boot-progress {
            width: 220px; height: 3px;
            background: #1a1a25;
            border-radius: 2px;
            overflow: hidden;
        }
        .boot-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--accent), #00aaff);
            transition: width 0.3s ease;
        }
        .boot-status { margin-top: 16px; font-size: 12px; color: var(--text-dim); }
        #global-voice[hidden] { display: none !important; }
        #global-voice { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + max(2px, calc((var(--taskbar-h) - 48px) / 2))); z-index: 10020; width: 48px; height: 48px; border: 1px solid var(--accent); border-radius: 50%; background: rgba(5,18,24,.9); color: var(--accent); font-size: 22px; cursor: pointer; box-shadow: 0 0 18px rgba(0,255,204,.25); }
        #global-voice.listening { background: var(--danger); border-color: #ff9aaa; color: #fff; animation: pulse-mic 1s infinite; }
        #global-voice.processing { border-color: #ffd166; color: #ffd166; }


        html[data-desktop-shell="true"] .window.maximized > .window-titlebar {
            -webkit-app-region: drag;
        }
        html[data-desktop-shell="true"] .window-controls {
            -webkit-app-region: no-drag;
        }

        /* ========== LOGIN ========== */
        #login-screen {
            position: fixed; inset: 0; box-sizing: border-box;
            padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px))
                max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
            overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
            background: radial-gradient(ellipse at center, #0d1520 0%, #000 70%);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9000;
        }
        #login-screen.active { display: flex; }
        .login-card {
            box-sizing: border-box; min-width: 0; width: 100%; max-width: 360px;
            max-height: 100%; margin: auto; overflow-x: hidden; overflow-y: auto;
            overscroll-behavior: contain;
            background: var(--surface);
            border: 1px solid rgba(0,255,204,0.2);
            border-radius: 20px;
            padding: clamp(20px, 5vw, 36px);
            text-align: center;
            backdrop-filter: blur(20px);
        }
        .login-card *, .login-card *::before, .login-card *::after { box-sizing: border-box; min-width: 0; }
        .login-card input, .login-card select, .login-card textarea, .login-card button { max-width: 100%; }

        .login-avatar {
            width: 90px; height: 90px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px;
            background: rgba(0,255,204,0.08);
        }
        .login-title { font-size: 20px; margin-bottom: 6px; }
        .login-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 28px; }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00ccaa, #0099cc);
            border: none; border-radius: 12px;
            color: #000; font-size: 15px; font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,255,204,0.3); }
        .login-btn:active { transform: scale(0.98); }
        .login-hint { margin-top: 16px; font-size: 12px; color: var(--text-dim); }
        @media (max-height: 540px) and (orientation: landscape) {
            #login-screen { justify-content: flex-start; }
            .login-card { padding: 12px 20px; }
            .login-avatar { width: 56px; height: 56px; margin-bottom: 8px; }
            .login-sub { margin-bottom: 12px; }
            .login-hint { margin-top: 8px; }
        }

        /* ========== DESKTOP ========== */
        #desktop {
            position: fixed; inset: 0;
            display: none;
            background: #01030a;
        }
        #desktop.active { display: block; }

        #bg-canvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block;
            cursor: grab;
        }
        #bg-canvas:active { cursor: grabbing; }

        #orb-transcript {
            position: absolute;
            z-index: 8;
            left: 50%;
            bottom: calc(var(--taskbar-h) + clamp(18px, 4vh, 40px));
            transform: translateX(-50%);
            width: min(920px, calc(100vw - 36px));
            font-family: Consolas, "Lucida Console", monospace;
            text-align: center;
            outline: none;
            user-select: none;
            touch-action: pan-x;
        }
        .orb-transcript-line {
            min-height: 25px;
            padding: 2px 0;
            overflow: hidden;
            color: #d9f7ff;
            font-size: clamp(14px, 1.25vw, 17px);
            line-height: 1.45;
            letter-spacing: .015em;
            white-space: nowrap;
            text-overflow: ellipsis;
            transition: opacity .25s ease, filter .25s ease;
        }
        .orb-transcript-line.previous,
        .orb-transcript-line.next { opacity: .32; filter: blur(.65px); cursor: pointer; }
        .orb-transcript-line.previous:hover,
        .orb-transcript-line.next:hover { opacity: .52; filter: blur(.3px); }
        .orb-transcript-line.current {
            opacity: .96;
            color: #ebfcff;
            text-shadow: 0 0 14px rgba(80,217,255,.34);
        }
        #orb-transcript:focus-visible .orb-transcript-line.current {
            text-decoration: underline;
            text-decoration-color: rgba(95,233,255,.45);
            text-underline-offset: 5px;
        }
        @media (max-width: 520px) {
            #orb-transcript {
                bottom: calc(var(--taskbar-h) + 10px);
                width: calc(100vw - 20px);
            }
            .orb-transcript-line {
                min-height: 22px;
                max-height: 44px;
                font-size: 14px;
                line-height: 1.35;
                white-space: normal;
                overflow-wrap: anywhere;
            }
            .orb-transcript-line.current { font-size: 15px; }
            .orb-system-notice { max-height: 14vh; font-size: 12px; }
        }

        .desktop-icons {
            position: absolute;
            top: 20px; left: 16px;
            display: flex; flex-direction: column; gap: 18px;
            z-index: 10;
        }
        .desk-icon {
            width: 72px;
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 10px;
            transition: background 0.15s;
        }
        .desk-icon:hover, .desk-icon:active { background: rgba(0,255,204,0.12); }
        .desk-icon .icon-img {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .desk-icon span {
            font-size: 11px;
            text-align: center;
            color: #dde8ff;
            text-shadow: 0 1px 3px #000;
            line-height: 1.25;
        }

        /* ========== BOTTOM SYSTEM CONTROLS ========== */
        #system-controls {
            position: fixed;
            left: 0; right: 0;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
            height: var(--taskbar-h);
            display: flex;
            align-items: center;
            padding-left: max(12px, env(safe-area-inset-left, 0px));
            padding-right: max(12px, env(safe-area-inset-right, 0px));
            z-index: 8000;
            pointer-events: none;
        }
        #system-controls:has(#desktop-voice.listening), #system-controls:has(#desktop-voice.processing) { z-index: 2147483000; }
        #system-controls-left {
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }
        #start-btn {
            width: 44px; height: 44px;
            padding: 0;
            border: 0;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 18, 32, .54);
            cursor: pointer;
            transition: background .16s ease, transform .16s ease;
            pointer-events: auto;
        }
        #start-btn:hover, #start-btn:focus-visible { background: rgba(22, 42, 64, .82); }
        #start-btn:active { transform: scale(.96); }
        #start-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        #start-btn img { width: 34px; height: 34px; display: block; object-fit: contain; }
        #status-dot {
            width: 9px; height: 9px;
            flex: 0 0 9px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            pointer-events: auto;
        }
        #desktop-voice {
            position: absolute;
            right: max(12px, env(safe-area-inset-right, 0px));
            width: 44px; height: 44px;
            border: 1px solid rgba(0,230,195,.32);
            border-radius: 12px;
            background: rgba(10,18,32,.82);
            color: var(--accent);
            font-size: 21px;
            cursor: pointer;
            pointer-events: auto;
        }
        #desktop-voice:hover, #desktop-voice:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
        #desktop-voice.listening { background: var(--danger); color: #fff; }
        #desktop-voice.processing { border-color: #ffd166; color: #ffd166; }
        #clock {
            position: absolute;
            left: 50%;
            max-width: calc(100vw - 164px);
            transform: translateX(-50%);
            color: var(--text-dim);
            font-size: 13px;
            line-height: 1.25;
            font-variant-numeric: tabular-nums;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }



        /* ========== START MENU ========== */
        #start-menu {
            position: fixed;
            bottom: calc(var(--taskbar-h) + env(safe-area-inset-bottom, 0px) + 22px);
            left: max(10px, calc(env(safe-area-inset-left, 0px) + 10px));
            width: min(340px, calc(100vw - 20px));
            max-height: min(78dvh, calc(100dvh - var(--taskbar-h) - env(safe-area-inset-bottom, 0px) - 20px)) !important;
            background: rgba(13, 21, 36, .94);
            border: 1px solid rgba(106, 210, 255, .18);
            border-radius: 18px;
            backdrop-filter: blur(30px);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 8500;
            box-shadow: 0 18px 54px rgba(0,0,0,.56), inset 0 1px rgba(255,255,255,.035);
        }
        #start-menu.open { display: flex; }
        .sm-header {
            padding: 14px 16px 12px;
            border-bottom: 1px solid rgba(255,255,255,.07);
            display: flex; align-items: center; gap: 12px;
            flex: 0 0 auto;
        }
        .sm-avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(0,255,204,0.15);
            border: 1px solid var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .sm-user { font-size: 14px; font-weight: 500; }
        .sm-status { font-size: 11px; color: var(--text-dim); }
        .sm-search { padding: 12px 12px 8px; flex: 0 0 auto; display:flex; align-items:center; gap:6px; }
        #start-command-mic { flex:none; min-height:42px; padding:0 10px; border:1px solid #315166; border-radius:12px; background:#102332; color:var(--text); font:inherit; cursor:pointer; }
        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }
        #start-search {
            width: 100%; height: 42px;
            border: 1px solid rgba(107, 215, 255, .25);
            border-radius: 12px;
            padding: 0 13px;
            outline: none;
            background: rgba(4, 12, 24, .72);
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
        }
        #start-search::placeholder { color: #8595ae; }
        #start-search:focus { border-color: rgba(0,255,204,.7); box-shadow: 0 0 0 3px rgba(0,255,204,.1); }
        .sm-apps {
            padding: 4px 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 0;
            flex: 1 1 auto;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(100, 200, 255, .34) transparent;
        }
        .sm-apps::-webkit-scrollbar { width: 5px; }
        .sm-apps::-webkit-scrollbar-thumb { border-radius: 6px; background: rgba(100,200,255,.34); }
        .sm-app[hidden], #sm-apps > [data-search-hidden="true"] { display: none !important; }
        .sm-app {
            width: 100%;
            min-height: 48px;
            padding: 8px 11px;
            border: 1px solid transparent;
            border-radius: 12px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            background: transparent;
            color: var(--text);
            text-align: left;
            font: inherit;
            cursor: pointer;
            transition: background .15s ease, border-color .15s ease;
        }
        .sm-app:hover, .sm-app:focus-visible {
            background: rgba(62, 139, 180, .14);
            border-color: rgba(88, 209, 255, .18);
            outline: none;
        }
        .sm-app:active { background: rgba(0,255,204,.12); }
        .sm-app .ico {
            width: 30px;
            flex: 0 0 30px;
            font-size: 22px;
            text-align: center;
        }
        .sm-app span {
            flex: 1;
            min-width: 0;
            color: var(--text);
            font-size: 13px;
            line-height: 1.3;
        }
        .sm-app.sm-window-app { border-color: rgba(0,255,204,.1); }
        #sm-empty {
            padding: 14px 12px 18px;
            color: var(--text-dim);
            font-size: 13px;
            text-align: center;
        }
        #sm-empty[hidden] { display: none; }
        .sm-footer {
            padding: 10px;
            border-top: 1px solid rgba(255,255,255,.07);
            display: flex; gap: 6px;
            flex: 0 0 auto;
        }
        .sm-footer button {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(255,255,255,.05);
            border-radius: 10px;
            background: rgba(255,255,255,.05);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
        }
        .sm-footer button:hover { background: rgba(255,255,255,.1); }
        /* ========== WINDOWS ========== */
        .window {
            position: absolute;
            min-width: 280px; min-height: 200px;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--window-radius);
            display: flex; flex-direction: column;
            box-shadow: 0 16px 48px rgba(0,0,0,0.45);
            overflow: hidden;
            z-index: 100;
            backdrop-filter: blur(20px);
        }
        .window.maximized {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            min-width: 0 !important;
            min-height: 0 !important;
            border-radius: 0;
            box-sizing: border-box !important;
            padding: var(--panthorium-safe-area-top) 0px 0px 0px !important;
        }
        .window.maximized .window-resize { display: none; }
        .panthorium-managed-window.panthorium-window-fullscreen {
            position: fixed !important; inset: 0 !important;
            width: 100vw !important; height: 100vh !important; height: 100dvh !important;
            min-width: 0 !important; min-height: 0 !important;
            max-width: none !important; max-height: none !important;
            margin: 0 !important; border-radius: 0 !important; box-sizing: border-box !important;
            padding: var(--panthorium-safe-area-top) 0px 0px 0px !important;
            overflow: hidden !important;
        }
        .panthorium-window-control {
            min-width: 38px; min-height: 38px; margin-left: 5px; padding: 5px 10px;
            border: 1px solid rgba(255,255,255,.24); border-radius: 8px;
            background: rgba(20,28,38,.92); color: #e8f0ff; font: 600 15px/1 system-ui,sans-serif;
            cursor: pointer; touch-action: manipulation;
        }
        .panthorium-window-control:hover,.panthorium-window-control:focus-visible { border-color: #00d9b7; outline: none; }
        @media (orientation: portrait) {
            .window.maximized, .panthorium-managed-window.panthorium-window-fullscreen {
                padding: var(--panthorium-safe-area-top) 0px var(--panthorium-shell-dock-clearance) 0px !important;
            }
        }
        @media (orientation: landscape) {
            .window.maximized, .panthorium-managed-window.panthorium-window-fullscreen {
                padding: var(--panthorium-safe-area-top) 0px var(--panthorium-shell-dock-clearance) 0px !important;
            }
            html[data-window-landscape-edge-to-edge="false"] .window.maximized,
            html[data-window-landscape-edge-to-edge="false"] .panthorium-managed-window.panthorium-window-fullscreen {
                padding: var(--panthorium-safe-area-top) 0px var(--panthorium-shell-dock-clearance) 0px !important;
            }
        }
        .window-titlebar {
            height: 38px;
            background: rgba(0,0,0,0.25);
            display: flex; align-items: center;
            padding: 0 12px;
            cursor: grab;
            gap: 8px;
            flex-shrink: 0;
        }
        .window-titlebar:active { cursor: grabbing; }
        .window-title {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .window-controls { display: flex; gap: 6px; }
        .win-btn {
            width: 28px; height: 28px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .win-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
        .win-btn.close:hover { background: var(--danger); color: #fff; }
        .window-body {
            flex: 1;
            overflow: auto;
            position: relative;
            min-width: 0; min-height: 0; overscroll-behavior: contain;
        }
        .window, .panthorium-managed-window {
            box-sizing: border-box; min-width: 0;
            max-width: 100vw; max-height: 100dvh;
        }
        .window *, .panthorium-managed-window * { box-sizing: border-box; min-width: 0; }
        .window-body > *, .panthorium-managed-window > * { min-width: 0; max-width: 100%; }
        .window img, .window video, .window canvas, .window iframe,
        .panthorium-managed-window img, .panthorium-managed-window video,
        .panthorium-managed-window canvas, .panthorium-managed-window iframe { max-width: 100%; }
        @media (max-width: 520px) {
            .window-titlebar { min-width: 0; gap: 4px; padding-inline: 8px; }
            .window-title { min-width: 0; font-size: 12px; }
            .window-controls { flex: 0 0 auto; gap: 3px; }
            .panthorium-window-control { margin-left: 0; min-width: 34px; min-height: 34px; padding: 4px 7px; }
        }
        @media (max-height: 520px) and (orientation: landscape) {
            .window-body { min-height: 0; overflow: auto; }
        }
        .window-resize {
            position: absolute;
            right: 0; bottom: 0;
            width: 16px; height: 16px;
            cursor: nwse-resize;
        }
        /* Shared deep-space glass treatment for current and future windows. */
        .window {
            background: linear-gradient(148deg, rgba(17, 26, 48, .97), rgba(7, 13, 29, .98));
            border-color: rgba(75, 232, 224, .3);
            box-shadow: 0 18px 58px rgba(0, 0, 0, .56), 0 0 24px rgba(0, 205, 196, .09);
        }
        .window:focus-within { border-color: rgba(90, 239, 224, .58); box-shadow: 0 18px 58px rgba(0,0,0,.56), 0 0 28px rgba(0,205,196,.16); }
        .window-titlebar { background: linear-gradient(100deg, rgba(21, 54, 77, .92), rgba(35, 31, 73, .9)); border-bottom: 1px solid rgba(84, 222, 228, .16); }
        .window-title { color: #e5f6ff; text-shadow: 0 0 12px rgba(91, 222, 238, .16); }
        .window-controls .win-btn:hover { background: rgba(64, 221, 217, .14); color: #c9fffb; }
        #panthorium-voice-identity:not(.panthorium-managed-window) {
            box-sizing: border-box !important; max-width: 100vw; max-height: 100dvh;
            overflow-x: hidden !important; overflow-y: auto !important; overscroll-behavior: contain;
            inset: 0 !important;
            background: radial-gradient(ellipse at 85% 8%, rgba(64, 93, 170, .24), transparent 42%), linear-gradient(145deg, rgba(13, 25, 47, .98), rgba(5, 12, 27, .99)) !important;
            border: 1px solid rgba(47, 225, 210, .43) !important;
            box-shadow: 0 0 36px rgba(34, 219, 208, .12), 0 24px 80px rgba(0,0,0,.72) !important;
            color: #e7f7ff !important;
            backdrop-filter: blur(22px);
        }

        #panthorium-voice-identity input, #panthorium-voice-identity select, #panthorium-voice-identity textarea { max-width: 100%; min-width: 0; }
        #panthorium-voice-identity button { max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
        #panthorium-voice-identity section { background: linear-gradient(145deg, rgba(20, 39, 66, .88), rgba(10, 20, 40, .92)) !important; border-color: rgba(77, 206, 222, .26) !important; box-shadow: inset 0 1px rgba(255,255,255,.035); }
        #panthorium-voice-identity h2, #panthorium-voice-identity h3 { color: #e8faff; text-shadow: 0 0 15px rgba(51, 215, 221, .18); }
        #panthorium-voice-identity input, #panthorium-voice-identity select { background: rgba(4, 13, 29, .88) !important; border-color: rgba(72, 190, 211, .36) !important; border-radius: 10px !important; color: #effcff !important; outline: none; }
        #panthorium-voice-identity input:focus, #panthorium-voice-identity select:focus { border-color: #43e6d3 !important; box-shadow: 0 0 0 3px rgba(67, 230, 211, .12); }
        #panthorium-voice-identity button { border: 1px solid rgba(67, 230, 211, .36); border-radius: 10px; background: linear-gradient(120deg, rgba(22, 102, 111, .46), rgba(45, 48, 111, .43)); color: #e6fbff; padding: 8px 12px; cursor: pointer; }
        #panthorium-voice-identity button:hover:not(:disabled) { border-color: rgba(93, 255, 230, .75); box-shadow: 0 0 18px rgba(51, 224, 212, .14); }
        #panthorium-voice-identity button:disabled { opacity: .48; cursor: not-allowed; }
        @media (max-width: 760px) {
            #panthorium-voice-identity:not(.panthorium-managed-window) {
                inset: 0 !important;
                padding: clamp(10px, 3vw, 16px) !important; border-radius: 14px !important;
            }
            #panthorium-voice-identity > div:nth-child(2) { grid-template-columns: minmax(0, 1fr) !important; }
            .window { max-width: calc(100vw - 16px); max-height: calc(100dvh - 16px); }

        /* ========== APP CONTENT STYLES ========== */
        .app-content { padding: 16px; height: 100%; }

        /* Sentinel Chat */
        .chat-container {
            display: flex; flex-direction: column;
            height: 100%;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.45;
            word-break: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: rgba(0,255,204,0.15);
            border: 1px solid rgba(0,255,204,0.25);
        }
        .msg.ai {
            align-self: flex-start;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .msg .provider {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 4px;
        }
        .chat-input-area {
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex; gap: 8px;
            align-items: center;
        }
        .chat-input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        .chat-input:focus { border-color: rgba(0,255,204,0.4); }
        .chat-send, .chat-mic {
            width: 42px; height: 42px;
            border-radius: 12px;
            border: none;
            background: rgba(0,255,204,0.15);
            color: var(--accent);
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .chat-send:hover, .chat-mic:hover { background: rgba(0,255,204,0.25); }
        .chat-mic.listening { background: var(--danger); color: #fff; animation: pulse-mic 1s infinite; }
        @keyframes pulse-mic {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Settings */
        .settings-section {
            margin-bottom: 24px;
        }
        .settings-section h3 {
            font-size: 14px;
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 500;
        }
        .setting-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }
        .setting-row label {
            font-size: 12px;
            color: var(--text-dim);
        }
        .setting-row input, .setting-row select {
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text);
            font-size: 13px;
            outline: none;
        }
        .setting-row input:focus { border-color: var(--accent); }
        .btn-primary {
            padding: 10px 18px;
            background: linear-gradient(135deg, #00ccaa, #0099cc);
            border: none; border-radius: 10px;
            color: #000; font-weight: 600; font-size: 13px;
            cursor: pointer;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-danger {
            padding: 10px 18px;
            background: rgba(255,68,102,0.2);
            border: 1px solid var(--danger);
            border-radius: 10px;
            color: var(--danger); font-size: 13px;
            cursor: pointer;
        }

        /* Notes / Files */
        .notes-area {
            width: 100%; height: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            padding: 16px;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        /* Calculator */
        .calc-display {
            background: rgba(0,0,0,0.4);
            padding: 20px 16px;
            font-size: 32px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            min-height: 70px;
            word-break: break-all;
        }
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: rgba(255,255,255,0.04);
            flex: 1;
        }
        .calc-btn {
            background: rgba(255,255,255,0.04);
            border: none;
            color: var(--text);
            font-size: 20px;
            padding: 18px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .calc-btn:hover { background: rgba(255,255,255,0.1); }
        .calc-btn.op { color: var(--accent); }
        .calc-btn.eq { background: rgba(0,255,204,0.15); color: var(--accent); }

        /* File Manager */
        .file-list { display: flex; flex-direction: column; gap: 4px; }
        .file-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .file-item:hover { background: rgba(255,255,255,0.06); }
        .file-item .fico { font-size: 20px; }
        .file-item .fname { flex: 1; font-size: 13px; }
        .file-item .fsize { font-size: 11px; color: var(--text-dim); }

        /* Terminal */
        .term {
            background: #0a0a12;
            height: 100%;
            padding: 12px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            overflow-y: auto;
            color: #a8ffb8;
        }
        .term-line { margin-bottom: 4px; white-space: pre-wrap; }
        .term-input-line { display: flex; gap: 8px; }
        .term-prompt { color: var(--accent); }
        .term-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #a8ffb8;
            font-family: inherit;
            font-size: inherit;
            outline: none;
        }

        /* About */
        .about-content {
            text-align: center;
            padding: 30px 20px;
        }
        .about-logo {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            margin: 0 auto 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
        }

        .orb-system-notice {
            position: fixed;
            top: calc(max(12px, env(safe-area-inset-top, 0px)) + clamp(28px, 7vh, 72px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 7501;
            display: none;
            width: min(920px, calc(100vw - 32px));
            max-height: min(18vh, 160px);
            margin: 0;
            padding: 0;
            overflow-y: auto;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: #d9f7ff;
            font-size: clamp(12px, 1.05vw, 14px);
            line-height: 1.45;
            text-align: center;
            overflow-wrap: anywhere;
            white-space: normal;
            text-shadow: 0 1px 4px rgba(0,0,0,.8);
            box-shadow: none;
            backdrop-filter: none;
            pointer-events: none;
            user-select: none;
        }
        .orb-system-notice.show { display: block; }

        /* Responsive */
        @media (max-width: 600px) {
            .desktop-icons { top: 12px; left: 8px; gap: 12px; }
            .desk-icon { width: 64px; }
            .desk-icon .icon-img { width: 40px; height: 40px; font-size: 20px; }
            #start-menu { width: calc(100% - 20px); left: 10px; }
            .window { min-width: 0; max-width: calc(100vw - 16px); max-height: calc(100dvh - 16px); }
            :root { --taskbar-h: 52px; }
        }

        /* Hidden video for face */
        #faceVideo {
            position: fixed;
            width: 1px; height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
